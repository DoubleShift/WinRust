# One workspace: one Cargo.lock, shared dependencies built once. Taskbar-only fork: the installer
# (plugin-launcher) and the other WinRust tools are removed from this repository.
[workspace]
resolver = "3"
members = ["common", "plugins/topbar"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
